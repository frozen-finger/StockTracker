name: Weekly A-share event collection

on:
  schedule:
    # Monday 06:00 Asia/Shanghai (GitHub cron is UTC).
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: Inclusive number of days to collect
        required: true
        default: "8"
      end_date:
        description: Optional end date (YYYY-MM-DD, Asia/Shanghai)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-a-share-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[test]'

      - name: Unit tests
        run: pytest

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          DAYS: ${{ inputs.days || '8' }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          args=(--days "$DAYS" --output-dir data)
          if [[ -n "$END_DATE" ]]; then
            args+=(--end-date "$END_DATE")
          fi
          stocktracker "${args[@]}"

      - name: Validate JSON
        if: always()
        run: python -m json.tool data/latest.json >/dev/null

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-events-${{ github.run_id }}
          path: data/
          retention-days: 30

      - name: Commit reports to main
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [[ -z "$(git status --porcelain --untracked-files=all -- data)" ]]; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history/
          git commit -m "data: update weekly A-share event report"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Propagate collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
