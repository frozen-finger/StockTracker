[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-event-collector"
version = "0.1.0"
description = "Weekly A-share ownership and shareholder governance event collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
stocktracker = "stocktracker.cli:main"

[tool.setuptools.packages.find]
include = ["stocktracker*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

